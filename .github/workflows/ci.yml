name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TZ: UTC
  PORT: 3333
  HOST: localhost
  APP_NAME: Relaxes Pour Le Vivant
  APP_URL: http://localhost:3333
  LOG_LEVEL: info
  APP_KEY: aHiNA4O4ZLpzu789anZ_c8DgqyAxEVJh
  NODE_ENV: test
  SESSION_DRIVER: memory
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_USER: admin
  DB_PASSWORD: admin
  DB_DATABASE: relaxes_pour_le_vivant
  SMTP_HOST: localhost
  SMTP_PORT: 1025
  SMTP_USERNAME: contact@mail.org
  SMTP_PASSWORD: smtp_password
  NC_API_TOKEN: generated-token
  NC_API_URL: http://localhost:3333
  ADMIN_EMAIL: info@example.org
  CONTACT_EMAIL: contact@mail.org

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npx prettier --check .

      - name: Run tests
        run: npm test
