services:
  db:
    image: postgres:18-alpine
    env_file: .env
    ports:
      - 5432:5432
    volumes:
      - ./database/postgres-init:/docker-entrypoint-initdb.d:Z
    healthcheck:
      interval: 10s
      retries: 10
      test: 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      timeout: 2s
  app-admin:
    image: nocodb/nocodb:0.265.1
    env_file: .env
    ports:
      - 4444:3333
    depends_on:
      db:
        condition: service_healthy
  metabase:
    image: metabase/metabase:latest
    env_file: .env
    ports:
      - 3000:3000
    depends_on:
      db:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - 8025:8025
      - 1025:1025
